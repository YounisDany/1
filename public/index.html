<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Presentation Generator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/css/styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header>
        <h1>AI Presentation Generator</h1>
        <p>Create polished slides with AI content, images, and one-click exports.</p>
      </header>

      <main>
        <section class="controls glass">
          <h2>Generate Deck</h2>
          <form id="generatorForm">
            <label>Topic<input type="text" id="topic" required placeholder="e.g. Future of Generative AI" /></label>
            <label>Tone
              <select id="tone">
                <option>Professional</option>
                <option>Inspirational</option>
                <option>Educational</option>
                <option>Technical</option>
              </select>
            </label>
            <label>Slides<input type="number" id="slideCount" min="3" max="15" value="6" /></label>
            <label>Theme
              <select id="theme">
                <option value="corporate">Corporate</option>
                <option value="light">Light</option>
                <option value="dark">Dark</option>
                <option value="creative">Creative</option>
              </select>
            </label>
            <button type="submit" id="generateBtn">Generate Presentation</button>
          </form>
          <div id="loading" class="loading hidden">Generating deck<span></span><span></span><span></span></div>
          <p id="error" class="error"></p>

          <div class="actions">
            <button id="suggestBtn" type="button">AI Design Suggestions</button>
            <button id="exportPdfBtn" type="button" disabled>Export PDF</button>
            <button id="exportPptBtn" type="button" disabled>Export PPTX</button>
          </div>

          <ul id="suggestions"></ul>
        </section>

        <section class="workspace">
          <article class="panel glass">
            <h3>Slide Editor (Markdown)</h3>
            <textarea id="markdownEditor" placeholder="Generated markdown appears here..."></textarea>
            <button id="applyEditsBtn" type="button">Apply Markdown Edits</button>
          </article>

          <article class="panel glass">
            <h3>Presentation Preview</h3>
            <div id="slidesContainer" class="slides"></div>
          </article>
        </section>
      </main>
    </div>
    <script type="module" src="/js/app.js"></script>
  </body>
</html>
